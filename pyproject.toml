[project]
name = "local-embed"
version = "0.3.1"
description = "Standalone local embedding server — GGUF / transformer models as an OpenAI-compatible /v1/embeddings service"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "juzcn", email = "zhangjun@cueb.edu.cn" },
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.0.0",
    "starlette>=0.37.0",
    "ruamel.yaml>=0.19.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/juzcn/local-embed"
Repository = "https://github.com/juzcn/local-embed"
Documentation = "https://github.com/juzcn/local-embed/blob/main/README.md"
Changelog = "https://github.com/juzcn/local-embed/releases"

[project.scripts]
local-embed = "local_embed.cli:main"

[build-system]
# Pin below hatchling 1.27 so the wheel stays at Metadata-Version 2.3 —
# twine rejects 2.5 before 7.0.  Lifting this requires raising the twine
# floor in .github/workflows/publish.yml to >=7 in the same change.
requires = ["hatchling>=1.24,<1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local_embed"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    # Required by starlette.testclient in tests/test_client.py and
    # tests/test_server.py.  Test-only — the package never imports httpx.
    "httpx>=0.28.0",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.format]
# README code fences hold illustrative snippets, not code this repo runs —
# leave them alone so doc edits never show up as formatting churn.
exclude = ["*.md"]

[tool.pyright]
include = ["local_embed", "tests"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "module"
addopts = "-q --tb=short --strict-markers --strict-config --no-header --color=yes --durations=10"
markers = [
    "asyncio: mark a test as an async test",
    "slow: mark a test as slow (excluded from quick runs with -m 'not slow')",
    "unit: fast, isolated unit test (no I/O, no subprocess)",
    "integration: test requiring I/O, network, or subprocess",
    "e2e: end-to-end test requiring a full running system",
]
